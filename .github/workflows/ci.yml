name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-gcc:
    name: Linux GCC build and verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build binutils

      - name: Toolchain versions
        run: g++ --version | head -1 && objdump --version | head -1 && cmake --version | head -1

      - name: Configure
        run: cmake --preset linux-gcc

      - name: Build
        run: cmake --build --preset linux-gcc

      - name: Verify facts
        run: ctest --preset linux-gcc

      - name: Upload binaries and listings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-lab-linux-gcc
          path: |
            build/linux-gcc/bin/
            build/linux-gcc/listings/
          retention-days: 30

  msvc:
    name: Windows MSVC build and verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Configure
        run: cmake --preset msvc

      - name: Build
        run: cmake --build --preset msvc

      - name: Verify facts
        run: ctest --preset msvc

      - name: Upload binaries and listings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: re-lab-windows-msvc
          path: |
            build/msvc/bin/
            build/msvc/listings/
          retention-days: 30
